name: Curriculum-KAG quality

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./ci.db
      SECRET_KEY: ci-only-secret
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal backend dependencies
        run: pip install -r backend/requirements-minimal.txt
      - name: UTF-8 gate
        run: python backend/check_text_encoding.py
      - name: Static quality and toast gate
        run: python backend/scripts/ci_static_gate.py
      - name: Release hygiene gate
        run: python backend/scripts/check_release_hygiene.py
      - name: Backend tests
        run: python backend/run_tests.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Production build
        working-directory: frontend
        run: npm run build
