name: Curriculum-KAG quality

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./ci.db
      SECRET_KEY: ci-only-secret
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install minimal backend dependencies
        run: pip install -r backend/requirements-ci.txt
      - name: UTF-8 gate
        run: python backend/check_text_encoding.py
      - name: Static quality and toast gate
        run: python backend/scripts/ci_static_gate.py
      - name: Dependency profile compatibility
        run: python backend/scripts/check_dependency_profiles.py
      - name: Production Python dependency audit
        run: pip-audit -r backend/requirements.lock --progress-spinner off
      - name: Generate backend dependency SBOM
        run: |
          mkdir -p .runtime/sbom
          pip-audit -r backend/requirements.lock --disable-pip --require-hashes \
            --format cyclonedx-json --output .runtime/sbom/backend.dependencies.cdx.json \
            --progress-spinner off
      - name: Upload backend SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-dependency-sbom
          path: .runtime/sbom/backend.dependencies.cdx.json
      - name: Release hygiene gate
        run: python backend/scripts/check_release_hygiene.py
      - name: Secret hygiene gate
        run: python backend/scripts/check_secret_hygiene.py
      - name: API route access inventory
        run: python backend/scripts/audit_api_route_inventory.py --output .runtime/api-route-inventory.json
      - name: Upload API route inventory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: api-route-access-inventory
          path: .runtime/api-route-inventory.json
      - name: OpenAPI planner contract
        run: python backend/scripts/check_openapi_contract.py
      - name: SQLite migration smoke
        run: python backend/scripts/check_sqlite_migrations.py
      - name: Public release structure
        shell: pwsh
        run: ./scripts/verify-public-release.ps1
      - name: Launcher hardening gate
        shell: pwsh
        run: ./scripts/check-launcher-hardening.ps1
      - name: Backend tests
        run: |
          mkdir -p .runtime
          coverage run --branch --source=backend/app -m pytest backend/tests -q
          coverage report -m --fail-under=30
          coverage xml -o .runtime/backend-coverage.xml
      - name: Upload backend coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-coverage
          path: .runtime/backend-coverage.xml

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Production build
        working-directory: frontend
        run: npm run build
      - name: Frontend unit tests
        working-directory: frontend
        run: npm test -- --run
      - name: i18n inline regression gate
        working-directory: frontend
        run: npm run check:i18n
      - name: Cytoscape style gate
        working-directory: frontend
        run: npm run check:graph-style
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start frontend preview
        working-directory: frontend
        run: npm run preview -- --host 127.0.0.1 --port 3001 > /tmp/curriculum-kag-frontend.log 2>&1 &
      - name: Playwright UI smoke
        working-directory: frontend
        # Backend health/authenticated scenarios run in the PostgreSQL job;
        # this job proves that the production frontend is not a blank shell.
        run: npx playwright test --grep-invert "backend health"
      - name: Upload frontend Playwright evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-playwright-results
          path: frontend/test-results
          if-no-files-found: ignore
      - name: Production dependency audit
        working-directory: frontend
        run: npm audit --omit=dev
      - name: Generate frontend dependency SBOM
        working-directory: frontend
        run: |
          mkdir -p ../.runtime/sbom
          npm sbom --package-lock-only --sbom-format=spdx --sbom-type=application > ../.runtime/sbom/frontend.dependencies.spdx.json
      - name: Upload frontend dependency SBOM
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-dependency-sbom
          path: .runtime/sbom/frontend.dependencies.spdx.json
          if-no-files-found: ignore

  postgres-endpoint-contracts:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-secret
      CURRICULUM_KAG_TEST_DATABASE_URL: postgresql+psycopg2://curriculum_user:curriculum_pass@localhost:5432/curriculum_kag_endpoint_test
      DATABASE_URL: postgresql+psycopg2://curriculum_user:curriculum_pass@localhost:5432/curriculum_kag_endpoint_test
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
        env:
          POSTGRES_USER: curriculum_user
          POSTGRES_PASSWORD: curriculum_pass
          POSTGRES_DB: curriculum_kag_endpoint_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U curriculum_user -d curriculum_kag_endpoint_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install PostgreSQL contract dependencies
        run: pip install -r backend/requirements-minimal.txt
      - name: Run authenticated PostgreSQL endpoint contracts
        run: python backend/tests/run_postgres_endpoint_contracts.py
      - name: Verify Alembic head after PostgreSQL migration
        run: python backend/scripts/check_alembic_state.py
      - name: Verify PostgreSQL dump and isolated restore
        run: python backend/scripts/check_postgres_restore.py

  authenticated-browser:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./ci-browser.db
      SECRET_KEY: ci-browser-secret
      APP_ENV: local
      AUTH_COOKIE_SECURE: false
      DOCS_ENABLED: false
      ALLOWED_HOSTS: '["127.0.0.1", "localhost"]'
      CORS_ORIGINS: '["http://127.0.0.1:3001"]'
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3001
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install backend smoke dependencies
        run: pip install -r backend/requirements-minimal.txt
      - name: Seed browser smoke account
        run: python backend/scripts/seed_browser_smoke.py
      - name: Start real backend
        run: python -m uvicorn app.main:app --app-dir backend --host 127.0.0.1 --port 8000 > /tmp/curriculum-kag-backend.log 2>&1 &
      - name: Wait for backend health
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/curriculum-kag-backend.log
          exit 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start frontend preview
        working-directory: frontend
        # The integration smoke needs Vite's /api proxy; the production bundle
        # itself is validated separately by the frontend build job.
        run: npm run dev -- --host 127.0.0.1 --port 3001 > /tmp/curriculum-kag-browser-frontend.log 2>&1 &
      - name: Wait for frontend health
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3001/login >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/curriculum-kag-browser-frontend.log
          exit 1
      - name: Real authenticated browser and axe smoke
        working-directory: frontend
        run: npx playwright test e2e/authenticated-real.spec.js
      - name: Upload authenticated browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: authenticated-browser-results
          path: frontend/test-results
          if-no-files-found: ignore

  deployment-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate production Compose
        run: docker compose --env-file .env.production.example -f docker-compose.production.yml config --quiet
